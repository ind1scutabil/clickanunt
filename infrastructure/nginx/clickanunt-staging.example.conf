# Nginx template for ClickAnunț STAGING.
# Replace REQUIRED_STAGING_DOMAIN before enabling.
# Do NOT use server_name clickanunt.ro or www.clickanunt.ro here.
# Upstream must point at the staging Next port (default 3001), not production 3000.

# HTTP — ACME + redirect
server {
    listen 80;
    listen [::]:80;
    server_name REQUIRED_STAGING_DOMAIN;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS staging
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name REQUIRED_STAGING_DOMAIN;

    # After certbot / ACME — paths are host-specific; do not copy production cert paths blindly
    ssl_certificate     /etc/letsencrypt/live/REQUIRED_STAGING_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/REQUIRED_STAGING_DOMAIN/privkey.pem;

    # Staging must not be indexed
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    server_tokens off;

    # Optional basic auth gate (recommended until team ACL exists)
    # auth_basic "ClickAnunt Staging";
    # auth_basic_user_file /etc/nginx/htpasswd-clickanunt-staging;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location = /api/messages/events {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
