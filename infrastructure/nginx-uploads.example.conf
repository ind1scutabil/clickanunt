# Example: serve user uploads from disk (Next.js app on another port).
# Adjust paths and upstream to match the server. Not loaded automatically — copy into your nginx site config.
#
# Verification (after deploy):
#   curl -sI "https://www.YOURDOMAIN/uploads/listings/<id>/original/<file>.jpg"
# Expect: HTTP/2 200 and Content-Type: image/*

location /uploads/ {
    alias /var/www/clickanunt/public/uploads/;
    access_log off;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    try_files $uri =404;
}
