version: "3.8"
services:
  db:
    image: postgres:15
    container_name: autoplat-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: autoplat
      POSTGRES_PASSWORD: autoplat123
      POSTGRES_DB: autoplat
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autoplat -d autoplat"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db-data: