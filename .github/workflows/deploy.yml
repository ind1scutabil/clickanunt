name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

      - name: Run type checking
        run: npm run type-check

      - name: Run tests
        run: npm run test

      - name: Build application
        run: npm run build
        env:
          NODE_ENV: production

      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to server
        run: |
          echo "🚀 Starting deployment to ${{ secrets.HOST }}..."

          # Test SSH connection
          ssh -o StrictHostKeyChecking=yes -i ~/.ssh/id_rsa \
            -p ${{ secrets.PORT }} \
            ${{ secrets.USERNAME }}@${{ secrets.HOST }} \
            "echo '✅ SSH connection successful'"

          # Execute deployment commands
          ssh -o StrictHostKeyChecking=yes -i ~/.ssh/id_rsa \
            -p ${{ secrets.PORT }} \
            ${{ secrets.USERNAME }}@${{ secrets.HOST }} \
            "
              set -e

              echo '📁 Navigating to application directory...'
              cd ${{ secrets.APP_DIR }}

              echo '🔄 Fetching latest changes...'
              git fetch origin main
              git reset --hard origin/main

              echo '📦 Installing dependencies...'
              npm ci

              echo '🔨 Building application...'
              npm run build

              echo '🔄 Restarting application with PM2...'
              pm2 restart ${{ secrets.PM2_APP_NAME }} --update-env || \
              pm2 start npm --name ${{ secrets.PM2_APP_NAME }} -- start --cwd ${{ secrets.APP_DIR }}

              echo '📊 Checking application status...'
              pm2 status ${{ secrets.PM2_APP_NAME }}

              echo '✅ Deployment completed successfully!'
            "

      - name: Health check
        run: |
          echo "🔍 Performing health check..."
          sleep 10

          # Try health check up to 3 times
          for i in {1..3}; do
            if curl -f -s https://www.clickanunt.ro/api/health > /dev/null; then
              echo "✅ Health check passed"
              exit 0
            fi
            echo "⚠️  Health check attempt $i failed, retrying..."
            sleep 5
          done

          echo "❌ Health check failed after 3 attempts"
          exit 1

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Deployment failed!"
          echo "Check the logs above for details."
          echo "You may need to:"
          echo "1. Check server logs: ssh ${{ secrets.USERNAME }}@${{ secrets.HOST }} 'pm2 logs ${{ secrets.PM2_APP_NAME }} --lines 50'"
          echo "2. Manually restart: ssh ${{ secrets.USERNAME }}@${{ secrets.HOST }} 'cd ${{ secrets.APP_DIR }} && pm2 restart ${{ secrets.PM2_APP_NAME }}'"
          echo "3. Check application status: ssh ${{ secrets.USERNAME }}@${{ secrets.HOST }} 'pm2 status'"