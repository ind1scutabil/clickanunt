# Aliniat la topologia reală de producție (FAZA 21E, 2026-07-28): release-uri
# imutabile sub /var/www/clickanunt-releases/<ts>-<sha> cu symlink `current`,
# comutate prin scripts/deploy-production-release.sh (SHA verificat pe remote,
# lock anti-concurență, live-SHA confirmat înainte de orice schimbare, build +
# migrații Prisma pe VPS, health-check cu rollback automat la orice eșec).
# Acest job NU rulează build-ul de deploy — doar declanșează scriptul pe VPS
# via SSH; buildul/migrațiile/pornirea PM2 se întâmplă acolo, sub lock.
name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      approve_migrations:
        description: "Aprobă rularea migrațiilor Prisma în așteptare (altfel deploy-ul refuză și se oprește dacă există migrații nerulate)"
        type: boolean
        default: false

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

      - name: Run type checking
        run: npm run type-check

      - name: Run tests
        run: npm run test

      - name: Build application (pre-flight gate — VPS rebuilds independently)
        run: npm run build
        env:
          NODE_ENV: production

      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.HOST }} >> ~/.ssh/known_hosts

      - name: Deploy release on server
        run: |
          echo "🚀 Deploying $GITHUB_SHA to ${{ secrets.HOST }} via deploy-production-release.sh..."

          ssh -o StrictHostKeyChecking=yes -i ~/.ssh/id_rsa \
            -p ${{ secrets.PORT }} \
            ${{ secrets.USERNAME }}@${{ secrets.HOST }} \
            "
              set -e

              RELEASES_ROOT=/var/www/clickanunt-releases
              CURRENT_LINK=\"\$RELEASES_ROOT/current\"

              echo '🔎 Citesc SHA-ul live curent (asumat de acest deploy)...'
              CURRENT_TARGET=\"\$(readlink -f \"\$CURRENT_LINK\")\"
              EXPECTED_LIVE_SHA=\"\$(git -C \"\$CURRENT_TARGET\" rev-parse HEAD)\"
              echo \"   live curent: \$EXPECTED_LIVE_SHA\"

              echo '📦 Rulez deploy-production-release.sh (validare SHA pe remote, lock, build, health-check, rollback automat la eșec)...'
              bash \"\$CURRENT_TARGET/scripts/deploy-production-release.sh\" \
                --sha ${{ github.sha }} \
                --expected-live-sha \"\$EXPECTED_LIVE_SHA\" \
                ${{ (github.event_name == 'workflow_dispatch' && inputs.approve_migrations) && '--approve-migrations' || '' }}

              echo '✅ deploy-production-release.sh a raportat succes (health-check intern deja trecut).'
            "

      - name: External health check (confirmare secundară, non-autoritativă)
        run: |
          echo "🔍 Confirmare externă — rollback-ul, dacă e nevoie, s-a întâmplat deja pe server, în interiorul scriptului."
          for i in {1..3}; do
            if curl -f -s https://www.clickanunt.ro/api/health > /dev/null; then
              echo "✅ Health check extern OK"
              exit 0
            fi
            echo "⚠️  Health check extern încercarea $i eșuată, reîncerc..."
            sleep 5
          done
          echo "❌ Health check extern eșuat după 3 încercări — verifică manual, scriptul a raportat succes intern dar situl nu răspunde public (posibil nginx/DNS, nu neapărat aplicația)."
          exit 1

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Deployment failed!"
          echo "Scriptul de deploy face rollback automat la orice eșec (symlink 'current' + PM2 revin la release-ul anterior) — verifică totuși manual:"
          echo "1. Log-uri: ssh ${{ secrets.USERNAME }}@${{ secrets.HOST }} 'pm2 logs clickanunt --lines 80'"
          echo "2. Status: ssh ${{ secrets.USERNAME }}@${{ secrets.HOST }} 'pm2 status && readlink -f /var/www/clickanunt-releases/current'"
          echo "3. Rollback manual la un release anterior specific: scripts/rollback-production-release.sh --release <timestamp>-<shortsha>"
